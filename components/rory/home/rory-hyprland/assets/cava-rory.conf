[general]
framerate = 60
autosens = 0
sensitivity = 100
bars = 96
lower_cutoff_freq = 45
higher_cutoff_freq = 16000

[input]
method = pipewire
source = auto
sample_rate = 48000
active = 1
virtual = 1

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
monstercat = 0
noise_reduction = 68
